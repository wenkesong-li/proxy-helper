name: Publish verified preview
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ProxyHelper-Windows-preview
          github-token: ${{ github.token }}
          run-id: 45786289631
          path: output
      - name: Upload verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v5.0.0-preview.1 output/*.zip --repo "$GITHUB_REPOSITORY" --clobber
