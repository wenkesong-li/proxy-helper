name: Publish verified preview
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      tag:
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ProxyHelper-Windows-preview
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          path: output
      - name: Upload verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" output/*.zip --repo "$GITHUB_REPOSITORY" --clobber
