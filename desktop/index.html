<!doctype html><html lang="zh"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#203342;font:15px 'Segoe UI','Microsoft YaHei',sans-serif}main{max-width:960px;margin:36px auto;padding:0 28px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;margin:0}p{color:#697d8e;line-height:1.6}.badge{background:#dcefeb;color:#187668;border-radius:20px;padding:8px 14px}.card{background:white;border:1px solid #e0e7ed;border-radius:18px;padding:26px;margin-top:20px;box-shadow:0 8px 28px #20334206}input{width:100%;padding:15px;border:1px solid #cbd7df;border-radius:10px;font:18px Consolas;margin:12px 0 18px}button{border:1px solid #cddbe3;border-radius:10px;padding:12px 18px;background:#fff;color:#244655;cursor:pointer;margin:0 8px 8px 0;font:inherit}button:hover{background:#e7f2f4;color:#164c58}button.primary{background:#087e8b;color:#fff;border-color:#087e8b}button.primary:hover{background:#066370;color:white}button:disabled{opacity:.45;cursor:wait}.danger{color:#aa4050}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid #eef2f5;word-break:break-all}th{color:#7c8d9a;font-weight:500}.notice{padding:15px;border-radius:10px;background:#edf4f8;line-height:1.6}#progress{height:4px;overflow:hidden;background:#d8e9ed;display:none;margin-top:14px}#progress:after{content:'';display:block;width:35%;height:4px;background:#087e8b;animation:move 1s infinite linear}@keyframes move{from{transform:translateX(-100%)}to{transform:translateX(400%)}}h2{font-size:18px;margin-top:0}small{color:#7b8e9a}</style>
<main><header><div><h1>代理配置助手</h1><p>集中配置 · 清晰反馈 · 随时恢复</p></div><span class="badge">Windows · 5.0 预览</span></header><div class="card"><h2>代理连接</h2><small id="system">窗口已就绪，正在读取系统配置…</small><input id="proxy" placeholder="http://127.0.0.1:7891"><div><button id="detect">重新检测</button><button id="test">测试连接</button><button class="primary" id="apply">应用用户配置</button><button class="danger" id="clear">清除用户配置</button></div><div id="progress"></div><div class="notice" id="message" role="status">启动界面不等待网络；每次系统操作最多等待 25 秒。</div></div><div class="card"><header><h2>当前代理变量</h2><button id="refresh">刷新</button></header><table><thead><tr><th>变量</th><th>当前用户</th><th>系统级（只读）</th></tr></thead><tbody id="values"></tbody></table><p><small>本预览版仅修改用户范围，避免默认影响其他用户。已有系统级变量会显示，清除用户配置不会删除系统级变量。已运行程序需要重启。</small></p><button id="startup-on">启用登录恢复</button><button id="startup-off">取消登录恢复</button><small id="startup"></small></div></main>
<script>
const $=id=>document.getElementById(id);let busy=false;function render(data){$('system').textContent='系统代理：'+(data.enabled?data.system:'未启用');$('startup').textContent=data.startup?'登录恢复已启用':'登录恢复未启用';$('values').replaceChildren();for(const v of data.values){const row=document.createElement('tr');for(const text of [v.name,v.user||'未设置',v.machine||'未设置']){const td=document.createElement('td');td.textContent=text;row.append(td)}$('values').append(row)}}function detect(data){let p=data.system||'';const match=p.match(/(?:^|;)http=([^;]+)/);if(match)p=match[1];if(p&&!p.includes('='))$('proxy').value=p.startsWith('http://')?p:'http://'+p;else if(data.values[0].user)$('proxy').value=data.values[0].user}
async function run(action,initial=false){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('progress').style.display='block';$('message').textContent='正在'+({status:'读取配置',test:'验证连接',apply:'应用配置',clear:'清除配置'}[action]||'更新登录设置')+'…';try{const data=await window.proxyHelper.run(action,$('proxy').value);render(data);if(initial)detect(data);$('message').textContent=action==='status'?'已读取实际配置。检测不会修改任何变量。':action==='test'?'HTTPS 代理连接成功。':data.message}catch(e){$('message').textContent='操作失败：'+e.message+'。可以重试，不会一直等待。'}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);$('progress').style.display='none'}}
for(const id of ['test','apply','startup-on','startup-off'])$(id).onclick=()=>run(id);$('clear').onclick=()=>{if(confirm('备份并清除当前用户代理配置？系统级代理保持不变。'))run('clear')};$('detect').onclick=()=>run('status',true);$('refresh').onclick=()=>run('status');run('status',true);
</script></html>
